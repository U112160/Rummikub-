<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rummikub Plus</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #e7eef9; color: #383c58; font-family: Georgia, serif; min-height: 100vh; padding: 12px; }
.game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.game-title { font-size: 20px; font-weight: bold; color: #4a5888; letter-spacing: 2px; }
.scores { display: flex; gap: 5px; }
.score-card { background: rgba(80,100,160,0.08); border: 1px solid #b8c8e8; border-radius: 5px; padding: 3px 8px; font-size: 13px; text-align: center; }
.score-card.active { border-color: #7888b8; background: rgba(80,100,160,0.18); }
.score-card .sname { color: #7888b8; font-size: 11px; }
.score-card .scount { font-size: 15px; font-weight: bold; color: #4a5888; }
.opponents { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.opponent { background: rgba(180,200,230,0.35); border: 1px solid #c0cce8; border-radius: 5px; padding: 4px 7px; font-size: 13px; flex: 1; text-align: center; cursor: pointer; transition: border-color 0.15s; color: #383c58; }
.opponent:hover { border-color: #7888b8; }
.opponent.active-turn { border-color: #4a5888; background: rgba(160,185,225,0.45); }
.opp-name { color: #4a68a8; font-size: 11px; font-weight: bold; }
.opp-tiles { color: #4a5888; font-size: 14px; font-weight: bold; }
.tile-back { width: 14px; height: 20px; border-radius: 2px; background: #dde5f5; border: 1px solid #ccd5ec; display: inline-block; }
.board-area { background: rgba(210,225,248,0.75); border: 2px solid #8aaad8; border-radius: 8px; min-height: 340px; padding: 10px; margin-bottom: 6px; }
.board-label { font-size: 13px; color: #4a68a8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
.sets-container { display: flex; flex-wrap: wrap; gap: 9px; min-height: 120px; align-content: flex-start; }
.set-wrapper { display: flex; flex-direction: column; }
.set-group { display: flex; gap: 5px; background: rgba(180,205,240,0.55); border: 1.5px solid #88aad8; border-radius: 5px; padding: 6px 8px; min-width: 34px; min-height: 58px; align-items: center; transition: border-color 0.15s; }
.set-group.valid-set { border-color: #6a9a48; }
.set-group.invalid-set { border-color: #88aad8; }
.set-group.drag-over { border-color: #3055aa !important; background: rgba(60,100,200,0.10) !important; }
.new-set-drop { min-width: 42px; min-height: 54px; border: 2px dashed #88aad8; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #7898cc; transition: all 0.15s; cursor: pointer; }
.new-set-drop.drag-over { border-color: #3055aa; color: #3055aa; background: rgba(60,100,200,0.08); }
.hand-area { background: rgba(240,245,255,0.70); border: 1px solid #b8c8e8; border-radius: 7px; padding: 7px; margin-bottom: 6px; }
.hand-top { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; flex-wrap: wrap; }
.hand-label { font-size: 13px; color: #4a68a8; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
.hand-tiles { display: flex; flex-wrap: wrap; gap: 8px; min-height: 58px; border-radius: 5px; padding: 5px; transition: background 0.15s; }
.hand-tiles.drag-over { background: rgba(80,100,160,0.04); outline: 1px dashed #7080c0; border-radius: 5px; }
.task-area { background: rgba(240,245,255,0.70); border: 1px solid #b8c8e8; border-radius: 7px; padding: 9px; margin-bottom: 6px; }
.task-area-label { font-size: 13px; color: #6878a8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px; font-weight: bold; }
.task-cards-row { display: flex; gap: 6px; flex-wrap: wrap; }
.task-card { background: rgba(180,200,230,0.35); border: 1px solid #c0cce8; border-radius: 5px; padding: 7px 10px; cursor: pointer; transition: border-color 0.15s; flex: 1; min-width: 100px; }
.task-card:hover { border-color: #4a5888; }
.task-card.done { border-color: #6a9a48; background: rgba(106,154,72,0.12); }
.task-name { font-size: 14px; color: #4a5888; line-height: 1.5; white-space: normal; font-weight: bold; }
.task-desc { font-size: 13px; color: #4a5888; line-height: 1.5; margin-top: 4px; }
.task-clear { font-size: 16px; color: #4a5888; font-weight: bold; margin-top: 4px; letter-spacing: 2px; }
.task-pending { display: none; }
.task-progress { font-size: 12px; color: #5a6aaa; margin-top: 2px; }
/* Tiles */
.tile { width: 36px; height: 52px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; border: 2px solid #88aad8; background: #f0f5ff; transition: transform 0.12s, box-shadow 0.12s; cursor: grab; flex-shrink: 0; }
.tile.hand-drop-target { outline: 3px solid #4a68a8; outline-offset: 2px; transform: translateX(4px); }
.tile:active { cursor: grabbing; }
.tile.dragging { opacity: 0.25; }
.tile.selected { transform: translateY(-6px); box-shadow: 0 4px 8px rgba(60,100,200,0.35); border-color: #3055aa; }
.tile.red { color: #c41111; }
.tile.blue { color: #1133bb; }
.tile.orange { color: #cc8800; }
.tile.black { color: #1a1008; }
.tile.joker-tile { color: #6600cc; font-size: 15px; font-weight: 900; border-color: #b090e0; background: #e0c8ff; }
.tile.from-hand-new { border-color: #4488dd; box-shadow: 0 0 4px rgba(60,130,220,0.40); }
.tile.ai-placed { border-color: #2244aa; box-shadow: 0 0 6px rgba(30,60,180,0.55); }
.tile.op-tile { background: #e0eaff; border-color: #7888cc; color: #332288; font-size: 17px; font-weight: 900; }
.tile.eq-tile { background: #dff0e8; border-color: #60aa70; color: #1a5a28; font-size: 16px; font-weight: 900; }
.controls { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }
.btn { padding: 5px 10px; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; transition: opacity 0.2s, transform 0.1s; font-family: Georgia, serif; }
.btn:hover { opacity: 0.85; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: #4868a8; color: #f4f7fe; }
.btn-danger { background: #aa3344; color: #f4f7fe; }
.btn-secondary { background: #4868a8; color: #f4f7fe; }
.btn-info { background: #4868a8; color: #f4f7fe; }
.btn-end { background: #4868a8; color: #f4f7fe; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-large { font-size: 16px; padding: 6px 13px; }
.msg-bar { background: rgba(240,245,255,0.80); border: 1px solid #c0cce8; border-radius: 4px; padding: 5px 11px; font-size: 14px; color: #4a5888; min-height: 26px; }
.turn-ind { font-size: 13px; color: #4a5888; font-weight: bold; margin-left: auto; }
.played-info { font-size: 12px; color: #6a9a48; font-weight: bold; }
.sort-btn { font-size: 13px; padding: 3px 8px; background: rgba(80,100,160,0.08); border: 1px solid #b8c8e8; color: #4a5888; border-radius: 3px; cursor: pointer; font-weight: bold; }
.sort-btn:hover { background: rgba(80,100,160,0.18); }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(40,50,90,0.55); align-items: center; justify-content: center; z-index: 100; }
.modal-overlay.show { display: flex; }
.modal { background: #e7eef9; border: 2px solid #ccd5ec; border-radius: 10px; padding: 20px; text-align: center; max-width: 380px; width: 90%; max-height: 85vh; overflow-y: auto; color: #383c58; }
.modal h3 { font-size: 18px; color: #4a5888; margin-bottom: 8px; }
.modal p { color: #4a5888; margin-bottom: 12px; font-size: 12px; }
.modal .stats { font-size: 11px; color: #7888b8; margin-bottom: 12px; line-height: 1.9; }
.lobby-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.lobby-box { background:#e7eef9; border:2px solid #ccd5ec; border-radius:12px; padding:28px 32px; max-width:380px; width:90%; text-align:center; box-shadow:0 4px 20px rgba(60,80,160,0.13); }
.lobby-box .game-title { font-size:24px; margin-bottom:16px; }
.lobby-box p { color:#4a5888; font-size:13px; margin-bottom:14px; }
.lobby-section { margin-top:14px; }
.lobby-input { width:100%; padding:7px 10px; border:1px solid #b8c8e8; border-radius:4px; font-size:14px; margin:5px 0 10px; font-family:Georgia,serif; background:#f4f7fe; color:#383c58; box-sizing:border-box; }
.lobby-code { font-size:2.2em; letter-spacing:6px; font-weight:bold; color:#4a5888; background:#dde8f8; border-radius:6px; padding:8px 16px; margin:8px auto; display:inline-block; cursor:pointer; user-select:all; }
.lobby-status { font-size:12px; color:#7888b8; margin:8px 0; min-height:18px; }
.btn-gap { gap:8px; display:flex; flex-direction:column; }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="lobby" class="lobby-wrap">
  <div class="lobby-box">
    <div class="game-title">RUMMIKUB +</div>
    <div id="lb-mode">
      <div class="btn-gap">
        <button class="btn btn-primary btn-large" onclick="showHostSetup()">建立遊戲（主機）</button>
        <button class="btn btn-secondary btn-large" onclick="showJoinSetup()">加入遊戲</button>
      </div>
    </div>
    <div id="lb-host" style="display:none">
      <!-- Step 0: host name -->
      <input class="lobby-input" id="lb-host-name" placeholder="你的名字（最多8字）" maxlength="8" style="margin-top:4px">
      <!-- Step 1: choose player count -->
      <div id="lb-count-select">
        <p style="margin-bottom:10px">總共幾位玩家？</p>
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn btn-primary btn-large" onclick="createRoom(2)">2人</button>
          <button class="btn btn-primary btn-large" onclick="createRoom(3)">3人</button>
          <button class="btn btn-primary btn-large" onclick="createRoom(4)">4人</button>
        </div>
      </div>
      <!-- Step 2: show room code -->
      <div id="lb-room-info" style="display:none">
        <p>將代碼分享給其他玩家</p>
        <div id="lb-code" class="lobby-code" title="點擊複製" onclick="copyCode()">----</div>
        <div class="lobby-status" id="lb-host-status"></div>
        <div class="lobby-status" id="lb-conn-status"></div>
        <button class="btn btn-primary" id="lb-start-btn" onclick="hostStartGame()" disabled style="width:100%;margin-top:8px">開始遊戲</button>
      </div>
      <button class="btn" style="background:#aab8d0;color:#fff;width:100%;margin-top:10px" onclick="backToMode()">返回</button>
    </div>
    <div id="lb-join" style="display:none">
      <input class="lobby-input" id="lb-name" placeholder="你的名字（最多8字）" maxlength="8">
      <input class="lobby-input" id="lb-roomcode" placeholder="輸入房間代碼" maxlength="50" oninput="this.value=this.value.toUpperCase()">
      <button class="btn btn-primary" onclick="joinGame()" style="width:100%">加入</button>
      <div class="lobby-status" id="lb-join-status"></div>
      <button class="btn" style="background:#aab8d0;color:#fff;width:100%;margin-top:6px" onclick="backToMode()">返回</button>
    </div>
  </div>
</div>
<div id="app" style="display:none">
  <div class="game-header">
    <div class="game-title">RUMMIKUB +</div>
    <div id="scores" class="scores"></div>
  </div>
  <div id="opponents" class="opponents"></div>
  <div class="board-area">
    <div class="board-label">桌面</div>
    <div id="board-sets" class="sets-container"></div>
  </div>
  <div class="controls" id="controls"></div>
  <div class="hand-area">
    <div class="hand-top">
      <div class="hand-label">手牌</div>
      <button class="sort-btn" onclick="sortHand('color')">按顏色</button>
      <button class="sort-btn" onclick="sortHand('number')">按數字</button>
      <div class="turn-ind" id="turn-text"></div>
      <div class="played-info" id="played-info"></div>
    </div>
    <div id="hand-tiles" class="hand-tiles"></div>
  </div>
  <div class="task-area">
    <div class="task-area-label">我的任務</div>
    <div id="task-list" class="task-cards-row"></div>
    <div style="font-size:12px;color:#4a5888;margin-top:4px;font-weight:bold">點擊任務卡判定（僅判定本回合你新放上去的牌）</div>
  </div>
  <div id="msg-bar" class="msg-bar">遊戲開始！首次出牌需30分以上（數字牌＋運算式均可計入）。</div>
</div>
<div id="modal-overlay" class="modal-overlay">
  <div class="modal" id="modal-box"></div>
</div>
<script>
const COLORS=['red','blue','orange','black'];
// 等號改成8張，功能牌機率較低
const OP_COUNTS={'+':5,'-':5,'×':3,'÷':3,'=':8};
// 刪除「用乘法」任務，只保留兩個
const ALL_TASKS=[
  {id:'even_sum', name:'打出一個組合\n數字總和為偶數', desc:'你新放上桌的牌中，有一個合法組合點數總和/結果為偶數'},
  {id:'two_expr',  name:'累計做出兩個運算式', desc:'累計跨回合：你出的算式累積達2個（可分多回合完成）', target:2},
];
let G={}, dragState=null, jokerPending=null;

/* ══════════ NETWORK ══════════ */
let NET={
  mode:'host',         // 'host' | 'client'
  peer:null,
  playerConns:[],      // host side: conn per player index (idx 0=self=null), size=playerCount
  hostConn:null,       // client side: conn to host
  myPlayerIndex:0,
  playerCount:3,       // chosen by host (2-4)
  myName:'玩家'        // filled from lobby
};
function myP(){return NET.myPlayerIndex;}
function isMyTurn(){return G.currentPlayer===myP()&&!G.gameOver;}
function isHost(){return NET.mode==='host';}
function isClient(){return NET.mode==='client';}

/* ── Lobby UI helpers ── */
function showHostSetup(){
  document.getElementById('lb-mode').style.display='none';
  document.getElementById('lb-host').style.display='block';
}
function createRoom(count){
  NET.myName=document.getElementById('lb-host-name').value.trim()||'玩家1';
  NET.playerCount=count;
  NET.playerConns=new Array(count).fill(null); // index 0=host(null), 1..count-1=remote slots
  NET.mode='host';
  document.getElementById('lb-count-select').style.display='none';
  document.getElementById('lb-room-info').style.display='block';
  document.getElementById('lb-host-status').textContent='連線中，請稍候...';
  const roomId='RMK-'+Math.random().toString(36).slice(2,8).toUpperCase();
  const peer=new Peer(roomId);
  NET.peer=peer;
  peer.on('open',id=>{
    document.getElementById('lb-code').textContent=id;
    updateConnStatus();updateStartBtn();
  });
  peer.on('error',e=>{document.getElementById('lb-host-status').textContent='連線錯誤：'+e.type;});
  peer.on('connection',conn=>{
    const slotIdx=NET.playerConns.findIndex((c,i)=>i>0&&c===null);
    if(slotIdx===-1){conn.send({type:'room_full'});conn.close();return;}
    NET.playerConns[slotIdx]=conn;
    conn.on('open',()=>{
      conn.send({type:'slot_assigned',playerIndex:slotIdx,playerCount:count});
      updateConnStatus();updateStartBtn();
    });
    conn.on('data',msg=>handleClientMessage(slotIdx,msg));
    conn.on('close',()=>{
      if(document.getElementById('lobby').style.display!=='none'){
        NET.playerConns[slotIdx]=null;updateConnStatus();updateStartBtn();
      } else if(!G.gameOver){
        setMsg(`${G.players[slotIdx]?.name||'玩家'} 已離線，遊戲中止。`,'error');
        G.gameOver=true;render();
      }
    });
  });
}
function updateConnStatus(){
  const joined=NET.playerConns.filter(c=>c!==null).length;
  const need=NET.playerCount-1;
  document.getElementById('lb-host-status').textContent=`等待玩家加入（需要 ${need} 人）`;
  document.getElementById('lb-conn-status').textContent=`已加入：${joined}／${need} 人`;
}
function updateStartBtn(){
  const joined=NET.playerConns.filter(c=>c!==null).length;
  document.getElementById('lb-start-btn').disabled=joined<NET.playerCount-1;
}
function copyCode(){
  const code=document.getElementById('lb-code').textContent;
  navigator.clipboard&&navigator.clipboard.writeText(code);
  document.getElementById('lb-host-status').textContent='代碼已複製！';
}
function showJoinSetup(){
  document.getElementById('lb-mode').style.display='none';
  document.getElementById('lb-join').style.display='block';
}
function backToMode(){
  if(NET.peer){NET.peer.destroy();NET.peer=null;}
  NET.mode='host';NET.playerConns=[];NET.hostConn=null;NET.myPlayerIndex=0;NET.playerCount=3;
  document.getElementById('lb-count-select').style.display='block';
  document.getElementById('lb-room-info').style.display='none';
  document.getElementById('lb-host').style.display='none';
  document.getElementById('lb-join').style.display='none';
  document.getElementById('lb-mode').style.display='block';
}
function joinGame(){
  const name=document.getElementById('lb-name').value.trim()||'玩家';
  NET.myName=name;
  const code=document.getElementById('lb-roomcode').value.trim();
  if(!code){document.getElementById('lb-join-status').textContent='請輸入代碼';return;}
  document.getElementById('lb-join-status').textContent='連線中...';
  const peer=new Peer();
  NET.peer=peer;NET.mode='client';
  peer.on('open',()=>{
    const conn=peer.connect(code);
    NET.hostConn=conn;
    conn.on('open',()=>{
      conn.send({type:'hello',name});
      document.getElementById('lb-join-status').textContent='已連線！等待主機開始遊戲...';
    });
    conn.on('data',msg=>handleHostMessage(msg));
    conn.on('error',e=>{document.getElementById('lb-join-status').textContent='連線失敗：'+e;});
    conn.on('close',()=>{if(!G.gameOver)setMsg('與主機連線中斷，遊戲中止。','error');});
  });
  peer.on('error',e=>{document.getElementById('lb-join-status').textContent='錯誤：'+e.type;});
}
function hostStartGame(){
  hideLobby();
  initGame(); // initGame() calls broadcastState() at end → sends state_update to all clients
}
function hideLobby(){
  document.getElementById('lobby').style.display='none';
  document.getElementById('app').style.display='block';
}

/* ── Host broadcasts state to all clients ── */
function broadcastState(msgText,winnerIdx){
  if(NET.mode!=='host') return;
  const publicState={
    boardSets:G.boardSets,
    currentPlayer:G.currentPlayer,
    playerNames:G.players.map(p=>p.name),
    playerHandCounts:G.players.map(p=>p.hand.length),
    playerHasPlayed:G.players.map(p=>p.hasPlayed),
    poolCount:G.pool.length,
    gameOver:G.gameOver,
    winnerIdx:winnerIdx!=null?winnerIdx:-1,
    aiPlacedThisRound:[...G.aiPlacedThisRound],
    playerPlacedIds:[...G.playerPlacedIds]
  };
  NET.playerConns.forEach((conn,pi)=>{
    if(!conn) return;
    conn.send({
      type:'state_update',
      publicState,
      privateHand:G.players[pi].hand,
      privateTasks:G.players[pi].tasks,
      playerIndex:pi,
      msg:msgText
    });
  });
}

/* ── Host receives action from client ── */
function handleClientMessage(playerIdx,msg){
  if(msg.type==='hello'){
    NET.playerConns[playerIdx]._peerName=msg.name;
    // Update player name immediately if game already started
    if(G.players&&G.players[playerIdx]) G.players[playerIdx].name=msg.name;
    updateConnStatus();updateStartBtn();
    return;
  }
  if(msg.type==='confirm_turn'){
    if(G.currentPlayer!==playerIdx){return;}
    // Validate board legality before accepting
    if(!msg.boardSets.every(s=>isValidSet(s))){
      NET.playerConns[playerIdx].send({type:'error',msg:'❌ 桌面有不合法組合，請修正。'});return;
    }
    if(!G.players[playerIdx].hasPlayed){
      const newIds=new Set(msg.newTilesOnBoard);
      const score=calcNewTilesScore(newIds,msg.boardSets);
      if(score<30){
        NET.playerConns[playerIdx].send({type:'error',msg:`❌ 首次出牌需30分，目前${score}分。`});return;
      }
    }
    G.players[playerIdx].hand=msg.hand;
    G.boardSets=msg.boardSets;
    msg.newTilesOnBoard.forEach(id=>G.playerPlacedIds.add(id));
    G.players[playerIdx].hasPlayed=true;
    if(msg.tasks) G.players[playerIdx].tasks=msg.tasks;
    G.newTilesOnBoard=[];G.turnBackup=null;G.selectedTiles=[];G.aiPlacedThisRound=new Set();
    if(G.players[playerIdx].hand.length===0&&G.players[playerIdx].tasks.every(t=>t.done)){
      endGame(playerIdx);return;
    }
    nextTurn();
  }
  if(msg.type==='draw_turn'){
    if(G.currentPlayer!==playerIdx) return;
    if(G.pool.length>0){
      const tile=G.pool.pop();
      G.players[playerIdx].hand.push(tile);
      NET.playerConns[playerIdx].send({type:'drew_tile',tile});
    }
    G.aiPlacedThisRound=new Set();
    nextTurn();
  }
}

/* ── Client receives state from host ── */
function handleHostMessage(msg){
  if(msg.type==='slot_assigned'){
    NET.myPlayerIndex=msg.playerIndex;
    NET.playerCount=msg.playerCount||3;
    document.getElementById('lb-join-status').textContent=`已入座（玩家 ${msg.playerIndex}），等待主機開始...`;
    return;
  }
  if(msg.type==='room_full'){
    document.getElementById('lb-join-status').textContent='❌ 房間已滿，請確認代碼或等待下一局。';
    return;
  }
  if(msg.type==='game_start'){
    NET.myPlayerIndex=msg.playerIndex; // state_update will handle rendering
    return;
  }
  if(msg.type==='state_update'){
    // Automatically switch from lobby to game on first state_update
    if(document.getElementById('lobby').style.display!=='none'){
      if(msg.playerIndex!=null) NET.myPlayerIndex=msg.playerIndex;
      hideLobby();
    }
    const ps=msg.publicState;
    G.boardSets=ps.boardSets;
    G.currentPlayer=ps.currentPlayer;
    G.gameOver=ps.gameOver;
    G.aiPlacedThisRound=new Set(ps.aiPlacedThisRound||[]);
    G.playerPlacedIds=new Set(ps.playerPlacedIds||[]);
    G.pool=Array(ps.poolCount).fill({id:-1,color:'back',number:0,isFake:true});
    if(!G.players||G.players.length!==ps.playerNames.length){
      G.players=ps.playerNames.map(()=>({name:'?',hand:[],tasks:[],hasPlayed:false,revealHand:false}));
    }
    ps.playerNames.forEach((name,i)=>{
      G.players[i].name=name;
      G.players[i].hasPlayed=ps.playerHasPlayed[i];
      G.players[i].revealHand=false;
      if(i===NET.myPlayerIndex){
        G.players[i].hand=msg.privateHand;
        G.players[i].tasks=msg.privateTasks;
      } else {
        G.players[i].hand=Array(ps.playerHandCounts[i]).fill(null).map((_,j)=>({id:-(i*1000+j),color:'back',number:0,isJoker:false,isOp:false,isFake:true}));
        G.players[i].tasks=[];
      }
    });
    // Always ensure local turn state exists; reset only on my turn
    if(G.currentPlayer===myP()){
      G.newTilesOnBoard=[];G.turnBackup=null;G.selectedTiles=[];
    } else {
      if(!G.newTilesOnBoard) G.newTilesOnBoard=[];
      if(!G.selectedTiles) G.selectedTiles=[];
      if(G.turnBackup===undefined) G.turnBackup=null;
    }
    // Skip hand re-render when it's not my turn (avoids flicker/layout jump)
    render(G.currentPlayer!==myP());
    if(msg.msg) setMsg(msg.msg,G.currentPlayer===myP()?'success':'info');
    if(ps.winnerIdx>=0) setTimeout(()=>endGame(ps.winnerIdx),300);
    return;
  }
  if(msg.type==='drew_tile'){
    G.players[myP()].hand.push(msg.tile);
    // Only append tile to hand without disturbing the rest of the layout
    renderHand(); renderScores();
    return;
  }
  if(msg.type==='error'){
    setMsg(msg.msg,'error');
    return;
  }
}

/* ══════════ INIT ══════════ */
function initGame(){
  let pool=[], id=0;
  for(let s=0;s<2;s++) for(let c of COLORS) for(let n=1;n<=13;n++)
    pool.push({id:id++,color:c,number:n,isJoker:false,isOp:false});
  pool.push({id:id++,color:'joker',number:0,isJoker:true,isOp:false});
  pool.push({id:id++,color:'joker',number:0,isJoker:true,isOp:false});
  for(const [op,cnt] of Object.entries(OP_COUNTS))
    for(let i=0;i<cnt;i++) pool.push({id:id++,color:'op',number:0,isJoker:false,isOp:true,op});
  shuffle(pool);
  const ts=shuffle([...ALL_TASKS]);
  let players=[];
  const n=NET.playerCount||3;
  for(let i=0;i<n;i++){
    const def=ts[i % ts.length];
    const myTask={...def, done:false, progress:0};
    const connName=NET.playerConns[i]&&NET.playerConns[i]._peerName;
    const name=i===0?NET.myName:(connName||`玩家${i+1}`);
    players.push({name, hand:pool.splice(0,14), hasPlayed:false, tasks:[myTask], revealHand:false});
  }
  G={pool, players, boardSets:[], currentPlayer:0, selectedTiles:[],
     turnBackup:null, newTilesOnBoard:[], aiPlacedThisRound:new Set(),
     playerPlacedIds:new Set(), gameOver:false};
  jokerPending=null;
  hideModal(); render();
  setMsg('遊戲開始！首次出牌需30分以上（數字牌＋運算式均可計入）。','info');
  if(NET.mode==='host') broadcastState('新遊戲開始！');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clone(x){return JSON.parse(JSON.stringify(x));}
function showModal(h){document.getElementById('modal-box').innerHTML=h;document.getElementById('modal-overlay').classList.add('show');}

/* ══════════ VALIDATION ══════════ */
function isValidSet(tiles){
  if(!tiles||tiles.length<3) return false;
  // 只要含 = 就走算式邏輯
  if(tiles.some(t=>t.isOp&&t.op==='=')) return isValidExpr(tiles);
  if(tiles.some(t=>t.isOp)) return false;
  return isValidRummikub(tiles);
}
function isValidRummikub(tiles){
  const real=tiles.filter(t=>!t.isJoker);
  if(real.length===0) return tiles.length>=3;
  const nums=real.map(t=>t.number).sort((a,b)=>a-b);
  const cols=real.map(t=>t.color);
  if(new Set(nums).size===1)
    return new Set(cols).size===cols.length&&tiles.length>=3&&tiles.length<=4;
  if(new Set(cols).size===1){
    if(new Set(nums).size!==nums.length) return false;
    return (Math.max(...nums)-Math.min(...nums)+1)<=tiles.length&&tiles.length>=3;
  }
  return false;
}
/* 把一組牌的所有排列都試過，找到能組成合法算式的排列 */
function permuteExprTiles(tiles){
  // 只排列「數字牌+運算符」，等號固定插入；對於小牌組做全排列，大牌組做啟發式排序
  const nums=tiles.filter(t=>!t.isOp);
  const ops=tiles.filter(t=>t.isOp&&t.op!=='=');
  const eqs=tiles.filter(t=>t.isOp&&t.op==='=');
  if(eqs.length===0) return [tiles]; // no = means not an expr, return as-is

  // For small sets try all permutations; for large sets return original + sorted attempts
  const nonEq=[...nums,...ops];
  if(nonEq.length<=6){
    const perms=[];
    function perm(arr,cur){
      if(cur.length===arr.length){perms.push([...cur,...eqs]);return;}
      for(let i=0;i<arr.length;i++){
        if(cur.some(x=>x.id===arr[i].id)) continue;
        cur.push(arr[i]);perm(arr,cur);cur.pop();
      }
    }
    perm(nonEq,[]);
    // Also try with eq in middle positions
    const results=[];
    for(const p of perms){
      // Try inserting = at each position
      for(let ei=1;ei<p.length;ei++){
        const t=[...p.slice(0,ei),...eqs,...p.slice(ei)];
        results.push(t);
      }
    }
    return results;
  }
  // Large set: just return original order + a few heuristic orders
  return [tiles];
}

function isValidExpr(tiles){
  if(!tiles.some(t=>t.isOp&&t.op==='=')) return false;
  // First try tiles as-is (for already-ordered tiles like from board/AI)
  if(_tryExprOrder(tiles)) return true;
  // Then try all permutations (for user-clicked tiles in arbitrary order)
  const perms=permuteExprTiles(tiles);
  return perms.some(p=>_tryExprOrder(p));
}

function _tryExprOrder(tiles){
  const exprStr=tiles.map(t=>{
    if(t.isJoker) return null;
    if(t.isOp) return t.op;
    return String(t.number);
  }).join('');
  if(exprStr.includes('null')) return false;
  const parts=exprStr.split('=');
  if(parts.length<2) return false;
  try{
    const vals=parts.map(p=>{
      const s=p.replace(/×/g,'*').replace(/÷/g,'/');
      if(!s) return null;
      if(!/^[\d+\-*/]+$/.test(s)) return null;
      if(/[+\-*/]{2,}/.test(s)) return null;
      if(/^[+\-*/]/.test(s)||/[+\-*/]$/.test(s)) return null;
      const v=Function('"use strict";return('+s+')')();
      return Number.isFinite(v)&&Number.isInteger(v)?v:null;
    });
    if(vals.some(v=>v===null)) return false;
    return vals.every(v=>v===vals[0]);
  }catch(e){return false;}
}

/* 找到一個合法的排列，並回傳排列後的 tiles（用於出牌前排序） */
function sortExprTiles(tiles){
  if(!tiles.some(t=>t.isOp&&t.op==='=')) return tiles;
  if(_tryExprOrder(tiles)) return tiles;
  const perms=permuteExprTiles(tiles);
  const valid=perms.find(p=>_tryExprOrder(p));
  return valid||tiles;
}

/* ══════════ FIRST-MELD SCORE ══════════
   計算本回合新放上桌的牌的分數：
   - 包含新牌的數字組合：只計算新牌的面值
   - 包含新牌的算式組合：整個算式等號左側的計算結果作為該組合的分數（因為一個算式是整體）
*/
/* ══════════ FIRST-MELD SCORE ══════════
   首次出牌30分計算規則：
   - 數字組合（純牌）：只計算本回合新放的牌面值
   - 算式組合：計算算式中「所有數字牌的面值總和」
     e.g. 8=7+1=8=4*2 → 8+7+1+8+4+2 = 30 ✓
     e.g. 4+5=9 → 4+5+9 = 18
   算式分數不以等號左側結果為準，而是所有數字牌面值加總
*/
function calcNewTilesScore(newIds, boardSets){
  let total=0;
  for(const set of boardSets){
    const newInSet=set.filter(t=>newIds.has(t.id));
    if(newInSet.length===0) continue;
    if(set.some(t=>t.isOp&&t.op==='=')){
      // 算式：所有數字牌（非運算符、非Joker）的面值加總
      const numSum=set.filter(t=>!t.isOp&&!t.isJoker).reduce((s,t)=>s+t.number,0);
      if(numSum>0) total+=numSum;
    } else {
      // 數字組合：只計算本回合新放的牌
      const disp=resolveSetDisplay(set);
      for(const t of newInSet){
        const r=disp.find(r=>r.tile.id===t.id);
        if(r&&typeof r.dispNum==='number') total+=r.dispNum;
      }
    }
  }
  return total;
}

/* ══════════ JOKER RESOLUTION ══════════ */
function resolveSetDisplay(tiles){
  if(tiles.some(t=>t.isOp))
    return tiles.map(t=>({tile:t,dispNum:t.isOp?t.op:(t.isJoker?'J':t.number),dispColor:t.isOp?'op':(t.isJoker?'joker':t.color),isJoker:!!t.isJoker,isOp:!!t.isOp}));
  const real=tiles.filter(t=>!t.isJoker),jokers=tiles.filter(t=>t.isJoker);
  if(real.length===0) return tiles.map(t=>({tile:t,dispNum:'J',dispColor:'joker',isJoker:true,isOp:false}));
  const nums=real.map(t=>t.number).sort((a,b)=>a-b),cols=real.map(t=>t.color);
  const isGroup=new Set(nums).size===1,isRun=new Set(cols).size===1&&new Set(nums).size===nums.length;
  if(isGroup){
    const n=nums[0],usedC=new Set(cols),res=[];
    for(const t of real) res.push({tile:t,dispNum:t.number,dispColor:t.color,isJoker:false,isOp:false});
    for(const j of jokers){const fc=COLORS.find(c=>!usedC.has(c))||'joker';usedC.add(fc);res.push({tile:j,dispNum:n,dispColor:fc,isJoker:true,isOp:false});}
    return res;
  }
  if(isRun){
    const color=cols[0],mn=Math.min(...nums),mx=Math.max(...nums),usedN=new Set(nums);
    const gaps=[];for(let n=mn+1;n<mx;n++) if(!usedN.has(n)) gaps.push(n);
    const jfg=Math.min(jokers.length,gaps.length),jfe=jokers.length-jfg;
    const posMap={};
    for(const t of real) posMap[t.number]={tile:t,dispNum:t.number,dispColor:color,isJoker:false,isOp:false};
    let ji=0;
    for(let i=0;i<jfg;i++) posMap[gaps[i]]={tile:jokers[ji++],dispNum:gaps[i],dispColor:color,isJoker:true,isOp:false};
    // Place edge jokers: respect jokerHint if present
    let s2=mn,e2=mx;
    for(let i=0;i<jfe;i++){
      const j=jokers[ji++];
      const hint=j?j.jokerHint:null; // 'before'|'after'|null
      if(hint==='after'&&e2<13){
        e2++;posMap[e2]={tile:j,dispNum:e2,dispColor:color,isJoker:true,isOp:false};
      } else if(hint==='before'&&s2>1){
        s2--;posMap[s2]={tile:j,dispNum:s2,dispColor:color,isJoker:true,isOp:false};
      } else if(s2>1){
        s2--;posMap[s2]={tile:j,dispNum:s2,dispColor:color,isJoker:true,isOp:false};
      } else if(e2<13){
        e2++;posMap[e2]={tile:j,dispNum:e2,dispColor:color,isJoker:true,isOp:false};
      }
    }
    return Object.keys(posMap).map(k=>+k).sort((a,b)=>a-b).map(k=>posMap[k]);
  }
  const res=real.map(t=>({tile:t,dispNum:t.number,dispColor:t.color,isJoker:false,isOp:false}));
  for(const j of jokers) res.push({tile:j,dispNum:'J',dispColor:'joker',isJoker:true,isOp:false});
  return res;
}
function sortSetTiles(tiles){return resolveSetDisplay(tiles).map(r=>r.tile);}

/* ══════════ JOKER MOBILITY CHECK ══════════
   判斷一個桌面組合中某個 Joker 是否「可以被移走」
   條件：移走該 Joker 後，剩餘牌仍能形成合法組合
*/
function isMobileJoker(set, jokerTile){
  if(!jokerTile.isJoker) return false;
  const remaining=set.filter(t=>t.id!==jokerTile.id);
  if(remaining.length<3) return false;
  return isValidSet(remaining);
}

/* ══════════ TASK CHECKING ══════════ */
/* 取得組合的「代表分數」：數字組合取牌面總和，算式取等號左側結果 */
function setRepresentativeSum(set){
  if(set.some(t=>t.isOp&&t.op==='=')){
    const exprStr=set.map(t=>t.isOp?t.op:String(t.number)).join('');
    const parts=exprStr.split('=');
    try{
      const s=parts[0].replace(/×/g,'*').replace(/÷/g,'/');
      const v=Function('"use strict";return('+s+')')();
      return Number.isInteger(v)?v:null;
    }catch(e){return null;}
  } else {
    const d=resolveSetDisplay(set);
    return d.reduce((s,r)=>s+(typeof r.dispNum==='number'?r.dispNum:0),0);
  }
}

/* 計算本回合新出的算式數量 */
function countNewExprs(newIds){
  return G.boardSets.filter(set=>set.some(t=>t.isOp)&&isValidExpr(set)&&set.some(t=>newIds.has(t.id))).length;
}

/* 判定單一任務是否「這次點擊就達成」（even_sum 是回合性的，two_expr 是累計的） */
function checkTaskForIds(taskId, newIds){
  if(newIds.size===0) return false;
  if(taskId==='even_sum'){
    return G.boardSets.some(set=>{
      if(!set.some(t=>newIds.has(t.id))) return false;
      if(!isValidSet(set)) return false;
      const sum=setRepresentativeSum(set);
      return sum!==null&&sum>0&&sum%2===0;
    });
  }
  if(taskId==='two_expr'){
    // 累計模式：取 task 的 progress，加上本回合新算式數量
    const task=G.players[myP()].tasks.find(t=>t.id==='two_expr');
    const alreadyDone=task?task.progress:0;
    const newExprs=countNewExprs(newIds);
    return (alreadyDone+newExprs)>=(task?.target||2);
  }
  return false;
}
function checkTask(taskId){
  return checkTaskForIds(taskId, new Set(G.newTilesOnBoard));
}

/* ══════════ RENDER ══════════ */
function render(skipHand=false){renderScores();renderOpponents();renderBoard();renderControls();renderHandLabel();if(!skipHand)renderHand();renderTasks();}
function renderHandLabel(){
  const tt=document.getElementById('turn-text'),pi=document.getElementById('played-info');
  if(!tt) return;
  tt.textContent=isMyTurn()?'✦ 你的回合':`等待 ${G.players[G.currentPlayer]?.name||'對方'}...`;
